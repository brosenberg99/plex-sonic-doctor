name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg and Chromaprint (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - name: Install ffmpeg and Chromaprint (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg chromaprint
      - name: Install ffmpeg with Chromaprint (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      - name: Which fingerprint method this system has
        shell: bash
        run: |
          ffmpeg -hide_banner -muxers | grep -i chromaprint || echo "ffmpeg here has no Chromaprint muxer"
          (command -v fpcalc && fpcalc -version) || echo "no fpcalc"

      - name: Install the app
        run: python -m pip install -e .
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  install-scripts:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and Chromaprint (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - name: Install ffmpeg and Chromaprint (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg chromaprint
      - name: Install ffmpeg with Chromaprint (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      - name: Run the installer (macOS / Linux)
        if: runner.os != 'Windows'
        run: sh install/install-mac-linux.sh
      - name: Run the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install-windows.ps1 -InstallDir "$env:RUNNER_TEMP\psd" -NoPath -NoShortcut -Yes

      - name: The installed app starts and serves its page
        shell: bash
        env:
          SONICDOCTOR_HOME: ${{ runner.temp }}/sonicdoctor-home
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP="$RUNNER_TEMP/psd/Scripts/sonicdoctor.exe"; else APP="$HOME/.local/bin/sonicdoctor"; fi
          "$APP" --version
          "$APP" check
          "$APP" batches
          "$APP" gui --no-browser --port 8765 > gui.log 2>&1 &
          for i in $(seq 1 30); do grep -q "http://127.0.0.1" gui.log && break; sleep 1; done
          cat gui.log
          # save the page first: piping curl into grep -q fails (curl exit 23) once the page outgrows one write
          curl -fsS -o page.html http://127.0.0.1:8765/
          grep -q "Plex Sonic Doctor" page.html
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/api/state)
          echo "API without the session key: $code"
          test "$code" = "403"
